{% extends "base.html" %}
{% block title %}Registro | PlayStart{% endblock %}
{% block content %}
<main style="max-width: 420px; margin: 60px auto; padding: 0 20px;">
    <div style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 32px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <span style="color: var(--petronas-primary); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; display: block; margin-bottom: 8px;">Nuevo Piloto</span>
        <h2 style="font-size: 24px; color: #ffffff; margin-bottom: 24px; font-family: 'Syne', sans-serif;">CREAR CUENTA</h2>
        <form action="/registro" method="POST" style="display: flex; flex-direction: column; gap: 18px;">
            <div>
                <label style="display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 600;">Nombre de usuario</label>
                <input type="text" name="username" required placeholder="Tu usuario" style="width: 100%; padding: 12px; background: #0a0a0a; border: 1px solid #333; border-radius: 4px; color: #ffffff; font-size: 14px; outline: none;">
            </div>
            <div>
                <label style="display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 600;">Correo electrónico</label>
                <input type="email" name="email" required placeholder="correo@ejemplo.com" style="width: 100%; padding: 12px; background: #0a0a0a; border: 1px solid #333; border-radius: 4px; color: #ffffff; font-size: 14px; outline: none;">
            </div>
            <div>
                <label style="display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 600;">Contraseña</label>
                <input type="password" name="password" required placeholder="••••••••" style="width: 100%; padding: 12px; background: #0a0a0a; border: 1px solid #333; border-radius: 4px; color: #ffffff; font-size: 14px; outline: none;">
            </div>
            <button type="submit" style="width: 100%; margin-top: 10px; padding: 12px; background: var(--petronas-primary); color: #000000; font-weight: 700; border: none; border-radius: 4px; cursor: pointer; text-transform: uppercase; font-size: 13px; letter-spacing: 0.05em;">Registrarse</button>
        </form>
        <p style="margin-top: 20px; text-align: center; font-size: 13px; color: var(--text-secondary);">
            ¿Ya tienes cuenta? <a href="/login" style="color: var(--petronas-primary); text-decoration: none; font-weight: 600;">Iniciar Sesión</a>
        </p>
    </div>
</main>
{% endblock %}
